<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Karen Zerpa">
    <meta name="description"
      content="Planeje sua próxima aventura de rafting! Entre em contato com a Correnteza Adventure para reservas ou dúvidas.">
    <title>Fale Conosco | Correnteza Adventure</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header class="header-grid">
        <img src="images/logo-rafting.png" alt="Logotipo da Empresa de Rafting" class="logo-img">
        <nav class="nav-flex">
            <a href="index.html">Página Inicial</a>
            <a href="sobre.html">Sobre Nós</a>
            <a href="passeios.html">Passeios</a>
            <a href="contato.html">Fale Conosco</a>
        </nav>
    </header>
    <main class="contact-layout">
        <h1>Fale Conosco</h1>
        <section class="contact-upper-grid">
            <div class="company-info-block">
                <h2>Contato</h2>
                <p><strong>Endereço:</strong> Av. das Corredeiras, 1500</p>
                <p><strong>Telefone:</strong> (11) 98888-7777</p>
                <div class="map-embed-container">
                    <iframe src="https://google.com" width="600" height="450" style="border:0;"
                      allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
                      title="Mapa de localização"></iframe>
                </div>
            </div>
            <div class="contact-form-block">
                <h2>Envie uma Mensagem</h2>
                <form action="#" method="post" class="adventure-form">
                    <div class="form-input-group">
                        <label for="username">Nome Completo:</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div class="form-input-group">
                        <label for="useremail">E-mail de Contato:</label>
                        <input type="email" id="useremail" name="useremail" required>
                    </div>
                    <fieldset class="purpose-fieldset">
                        <legend>Finalidade:</legend>
                        <div class="radio-option">
                            <input type="radio" id="geral" name="purpose" value="geral" checked>
                            <label for="geral">Consulta Geral</label>
                        </div>
                    </fieldset>
                    <div class="form-input-group">
                        <label for="message">Mensagem:</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn-action">Enviar Mensagem de Contato</button>
                </form>
            </div>
        </section>
        <section style="margin-top: 40px;">
            <h2>Nossos Guias</h2>
            <div class="main-grid" style="padding: 0;">
                <figure class="grid-card">
                    <img src="images/funcionario1.jpg" alt="Carlos Silva">
                    <figcaption>
                        <h3>Carlos Silva</h3>
                        <p>Instrutor Chefe</p>
                    </figcaption>
                </figure>
                <figure class="grid-card">
                    <img src="imagens/funcionario2.jpg" alt="Juliana Costa" style="display:none;">
                    <img src="images/funcionario2.jpg" alt="Juliana Costa">
                    <figcaption>
                        <h3>Juliana Costa</h3>
                        <p>Gerente</p>
                    </figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer class="footer-container">
        <p>&copy; 2026 Correnteza Adventure - Karen Zerpa</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com" target="_blank" rel="noopener"><img
                  src="images/facebook-icon.png" alt="Ícone do Facebook"></a>
            <a href="https://www.instagram.com" target="_blank" rel="noopener"><img
                  src="images/instagram-icon.jpg" alt="Ícone do Instagram"></a>
            <a href="https://twitter.com" target="_blank" rel="noopener"><img
                  src="images/twitter-icon.png" alt="Ícone do Twitter"></a>
        </nav>
    </footer>
</body>

</html>
